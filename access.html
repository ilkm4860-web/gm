<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Görkem Makine | Erişim</title><style>body{margin:0;min-height:100vh;background:#060708;color:#f4f1e9;font-family:Arial,sans-serif;display:grid;place-items:center}.box{width:min(520px,calc(100% - 32px));padding:32px;border:1px solid #292e31;background:#0e1215;border-radius:20px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.45)}.mark{width:50px;height:50px;margin:0 auto 18px;border:1px solid #d8a647;display:grid;place-items:center;color:#f1ca72;font-weight:900}.box h1{margin:0 0 10px}.box p{color:#899297;font-size:12px;line-height:1.7}.badge{display:inline-block;margin-top:16px;padding:8px 11px;border:1px solid rgba(216,166,71,.25);color:#f1ca72;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.err{margin-top:16px;padding:10px 12px;border:1px solid rgba(239,107,103,.25);color:#f19a96;border-radius:10px;font-size:10px}</style></head><body><div class="box"><div class="mark">GM</div><h1>GÖRKEM MAKİNE</h1><p>Bu bağlantı geçerli değil, süresi dolmuş veya daha önce kullanılmış olabilir.</p><div class="badge">Güvenli QR Erişimi</div><div id="err" class="err" style="display:none"></div></div><script>const q=new URLSearchParams(location.search).get('error');const m={invalid:'Geçersiz erişim kodu.',expired:'Bu erişim kodunun süresi dolmuş.',used:'Bu tek kullanımlık kod daha önce kullanılmış.'};if(q&&m[q]){const e=document.getElementById('err');e.textContent=m[q];e.style.display='block'}</script></body></html>
