<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Görkem Yönetim | Giriş</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(216,166,71,.1),transparent 28rem),#060708;color:#f4f1e9;font-family:Arial,sans-serif;display:grid;place-items:center}.wrap{width:min(430px,calc(100% - 30px));padding:26px;border:1px solid #292e31;background:#0f1418;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.brand{font-size:13px;font-weight:800;letter-spacing:.14em;color:#f1ca72}.sub{color:#899297;font-size:11px;line-height:1.6;margin-top:5px}.mark{width:44px;height:44px;border:1px solid rgba(216,166,71,.6);display:grid;place-items:center;color:#f1ca72;font-weight:900;margin-bottom:14px}h1{font-size:28px;margin:28px 0 8px}label{display:block;color:#b9c0c3;font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 7px}input{width:100%;height:46px;padding:0 12px;border-radius:10px;background:#080c0f;border:1px solid #292e31;color:#f4f1e9;outline:none}button{margin-top:16px;width:100%;height:46px;border-radius:10px;border:1px solid #d8a647;background:#d8a647;color:#111;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.err{margin-top:14px;color:#f19a96;background:rgba(239,107,103,.05);border:1px solid rgba(239,107,103,.25);padding:10px 12px;border-radius:10px;font-size:10px}</style></head><body><main class="wrap"><div class="mark">GM</div><div class="brand">GÖRKEM YÖNETİM</div><div class="sub">Yönetici Kontrol Merkezi</div><h1>YÖNETİCİ GİRİŞİ</h1><div class="sub">QR erişimlerini ve sistem bağlantılarını yönetmek için giriş yap.</div><form method="post" action="/admin-login"><label>Yönetici Şifresi</label><input name="password" type="password" autocomplete="current-password" required><button>Panele Gir</button></form><div id="err" class="err" style="display:none">Şifre hatalı.</div></main><script>if(new URLSearchParams(location.search).get('error'))document.getElementById('err').style.display='block';</script></body></html>
